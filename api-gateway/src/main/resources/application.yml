spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: clients
              uri: ${CLIENT_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/clients/**
            - id: campaigns
              uri: ${CAMPAIGN_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/campaigns/**
            - id: analytics
              uri: ${ANALYTICS_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/analytics/**
            - id: notifications
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/notifications/**

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces